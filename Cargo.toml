[package]
name = "leptotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Minimal component testing for Leptos: render a component to HTML and assert on it"
repository = "https://github.com/padamson/leptotes"
authors = ["Paul Adamson"]
categories = ["development-tools::testing", "web-programming"]
keywords = ["leptos", "testing", "component", "ssr"]

[lints.rust]
# Nothing here has a reason to reach for unsafe. `deny` (not `forbid`)
# leaves a targeted `#[allow(unsafe_code)]` escape hatch if a future FFI
# edge genuinely needs one.
unsafe_code = "deny"

# The policy the crate was written under in slp.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
# At the version scraper uses, since `Dom::parse` hands html5ever scraper's
# tree sink: a scraper release on a newer html5ever moves both together.
html5ever = "0.40"
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
scraper = { version = "0.29", default-features = false }
